databases:
  - name: examflow-db
    plan: free
    databaseName: examflow
    user: examflow

services:
  - type: web
    name: examflow-backend
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: examflow-db
          property: connectionString

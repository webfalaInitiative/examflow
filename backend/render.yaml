databases:
  - name: examflow-db
    plan: free
    databaseName: examflow
    user: examflow

services:
  - type: web
    name: examflow-backend
    runtime: node
    plan: free
    buildCommand: npm install --production=false && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: examflow-db
          property: connectionString
